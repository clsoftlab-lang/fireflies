  Fireflies DISPENSER wiring (reference). Spec section 4.
  Pico meters helium via a servo pinch-valve to near-neutral trim (HX711+load cell),
  self-tests the LED (photodiode), and releases one unit on the start button.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="sans-serif">
  <rect x="0" y="0" width="920" height="620" fill="#0b1020"/>
  <text x="24" y="34" fill="#ffd27f" font-size="22" font-weight="bold">Fireflies dispenser — wiring (reference)</text>
  <text x="24" y="56" fill="#9fb3c8" font-size="13">Load → fill-to-trim → arm + LED self-test → release one at a time (§4). Start button is the only live control; also all-stop.</text>

  <!-- Controller -->
  <g>
    <rect x="360" y="230" width="200" height="180" rx="10" fill="#152a1f" stroke="#7CFC98" stroke-width="2"/>
    <text x="460" y="258" fill="#c8ffd6" font-size="15" text-anchor="middle" font-weight="bold">Raspberry Pi Pico</text>
    <text x="460" y="276" fill="#9fb3c8" font-size="11" text-anchor="middle">(or Arduino Nano)</text>
    <text x="375" y="304" fill="#e6eef7" font-size="11">GP14/15 ◄ HX711</text>
    <text x="375" y="326" fill="#e6eef7" font-size="11">GP16 ► valve servo</text>
    <text x="375" y="348" fill="#e6eef7" font-size="11">GP26 ◄ photodiode</text>
    <text x="375" y="370" fill="#e6eef7" font-size="11">GP18 ► gate servo</text>
    <text x="375" y="392" fill="#e6eef7" font-size="11">GP2/3 ◄ buttons</text>
  </g>

  <!-- HX711 + load cell -->
  <g>
    <rect x="60" y="120" width="200" height="110" rx="8" fill="#132038" stroke="#ffd27f" stroke-width="2"/>
    <text x="160" y="148" fill="#e6eef7" font-size="14" text-anchor="middle">HX711 amp</text>
    <text x="160" y="168" fill="#9fb3c8" font-size="11" text-anchor="middle">24-bit ADC</text>
    <text x="160" y="190" fill="#9fb3c8" font-size="11" text-anchor="middle">→ sub-0.1 g lift</text>
    <rect x="60" y="250" width="200" height="80" rx="8" fill="#132038" stroke="#ffd27f" stroke-width="2"/>
    <text x="160" y="278" fill="#e6eef7" font-size="14" text-anchor="middle">Bar load cell</text>
    <text x="160" y="298" fill="#9fb3c8" font-size="11" text-anchor="middle">balloon free-lift (§F2)</text>
    <text x="160" y="316" fill="#9fb3c8" font-size="11" text-anchor="middle">tethered to free end</text>
  </g>

  <!-- Servo pinch valve -->
  <g>
    <rect x="60" y="380" width="200" height="90" rx="8" fill="#2a1f14" stroke="#ffb454" stroke-width="2"/>
    <text x="160" y="408" fill="#ffd27f" font-size="14" text-anchor="middle">Micro-servo valve</text>
    <text x="160" y="428" fill="#9fb3c8" font-size="11" text-anchor="middle">pinches He line</text>
    <text x="160" y="446" fill="#9fb3c8" font-size="11" text-anchor="middle">(low-pressure, post-regulator)</text>
  </g>

  <!-- Photodiode LED test -->
  <g>
    <rect x="660" y="120" width="200" height="100" rx="8" fill="#101c2e" stroke="#7fd0ff" stroke-width="2"/>
    <text x="760" y="148" fill="#bfe6ff" font-size="14" text-anchor="middle">Photodiode (hood)</text>
    <text x="760" y="168" fill="#9fb3c8" font-size="11" text-anchor="middle">LED self-test (§4.3)</text>
    <text x="760" y="188" fill="#9fb3c8" font-size="11" text-anchor="middle">confirms blink →</text>
    <text x="760" y="206" fill="#9fb3c8" font-size="11" text-anchor="middle">no dead unit released</text>
  </g>

  <!-- Gate servo -->
  <g>
    <rect x="660" y="250" width="200" height="90" rx="8" fill="#2a1f14" stroke="#ffb454" stroke-width="2"/>
    <text x="760" y="278" fill="#ffd27f" font-size="14" text-anchor="middle">Release-gate servo</text>
    <text x="760" y="298" fill="#9fb3c8" font-size="11" text-anchor="middle">frees one unit on</text>
    <text x="760" y="316" fill="#9fb3c8" font-size="11" text-anchor="middle">release command</text>
  </g>

  <!-- Buttons -->
  <g>
    <rect x="660" y="380" width="200" height="100" rx="8" fill="#132038" stroke="#ff6b6b" stroke-width="2"/>
    <text x="760" y="408" fill="#ffd0d0" font-size="14" text-anchor="middle">Start / All-stop</text>
    <text x="760" y="428" fill="#9fb3c8" font-size="11" text-anchor="middle">start = begin releasing</text>
    <text x="760" y="446" fill="#9fb3c8" font-size="11" text-anchor="middle">all-stop = halt at once</text>
    <text x="760" y="464" fill="#9fb3c8" font-size="11" text-anchor="middle">(handheld remote option)</text>
  </g>

  <!-- Wires -->
  <g stroke-width="2.5" fill="none">
    <path d="M260 175 H 300 V 304 H 360" stroke="#ffd27f"/>            <!-- HX711 -> Pico -->
    <path d="M160 230 V 250" stroke="#ffd27f"/>                         <!-- cell -> HX711 -->
    <path d="M260 420 H 320 V 326 H 360" stroke="#ffb454"/>             <!-- valve servo -> Pico -->
    <path d="M660 170 H 600 V 348 H 560" stroke="#7fd0ff"/>             <!-- photodiode -> Pico -->
    <path d="M660 295 H 610 V 370 H 560" stroke="#ffb454"/>             <!-- gate servo -> Pico -->
    <path d="M660 430 H 590 V 392 H 560" stroke="#ff6b6b"/>             <!-- buttons -> Pico -->
  </g>

  <text x="24" y="600" fill="#5f7488" font-size="11">Helium: asphyxiant in enclosed spaces; cylinders are high-pressure (§6). The servo only meters a regulated low-pressure line; firmware never drives the cylinder regulator.</text>
</svg>
